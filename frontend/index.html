<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      padding: 32px;
      width: 100%;
      max-width: 540px;
      height: fit-content;
    }
    h1 { font-size: 28px; color: #1a1a2e; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
    .input-row { display: flex; gap: 10px; margin-bottom: 8px; }
    input[type="text"] {
      flex: 1; padding: 12px 16px;
      border: 2px solid #e0e0e0; border-radius: 10px;
      font-size: 15px; outline: none;
    }
    input[type="text"]:focus { border-color: #4f46e5; }
    button {
      padding: 12px 20px; border: none; border-radius: 10px;
      cursor: pointer; font-size: 14px; font-weight: 600;
    }
    .btn-add { background: #4f46e5; color: white; }
    .btn-add:hover { background: #4338ca; }
    .stats { display: flex; gap: 10px; margin-bottom: 20px; font-size: 13px; }
    .stat { background: #f5f5f5; padding: 6px 12px; border-radius: 20px; color: #666; }
    .todo-list { list-style: none; }
    .todo-item {
      display: flex; align-items: center; gap: 10px;
      padding: 14px; border-radius: 10px; margin-bottom: 10px;
      background: #fafafa; border: 1px solid #ebebeb;
    }
    .todo-item.completed .task-text { text-decoration: line-through; color: #999; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4f46e5; cursor: pointer; }
    .task-text { flex: 1; font-size: 15px; color: #333; word-break: break-word; }
    .edit-input {
      flex: 1; padding: 6px 10px;
      border: 2px solid #4f46e5; border-radius: 8px; font-size: 15px; outline: none;
    }
    .actions { display: flex; gap: 6px; }
    .btn-edit { background: #e0e7ff; color: #4f46e5; padding: 6px 12px; font-size: 13px; }
    .btn-save { background: #dcfce7; color: #16a34a; padding: 6px 12px; font-size: 13px; }
    .btn-delete { background: #fee2e2; color: #dc2626; padding: 6px 12px; font-size: 13px; }
    .empty { text-align: center; color: #bbb; padding: 32px 0; }
    .error { color: #dc2626; font-size: 13px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Todo App</h1>
    <p class="subtitle">Keep track of your tasks</p>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..."
        onkeydown="if(event.key==='Enter') addTodo()"/>
      <button class="btn-add" onclick="addTodo()">+ Add</button>
    </div>
    <p class="error" id="error">Task cannot be empty!</p>

    <div class="stats">
      <span class="stat" id="totalStat">Total: 0</span>
      <span class="stat" id="doneStat">Done: 0</span>
      <span class="stat" id="pendingStat">Pending: 0</span>
    </div>

    <ul class="todo-list" id="todoList">
      <li class="empty">No tasks yet. Add one above!</li>
    </ul>
  </div>

  <script>
    const API = 'https://be-todo-eytb.onrender.com';

    async function loadTodos() {
      try {
        const res = await fetch(`${API}/todos`);
        const todos = await res.json();
        renderTodos(todos);
      } catch(e) { console.error('Failed to load', e); }
    }

    function renderTodos(todos) {
      const list = document.getElementById('todoList');
      const done = todos.filter(t => t.completed).length;
      document.getElementById('totalStat').textContent = `Total: ${todos.length}`;
      document.getElementById('doneStat').textContent = `Done: ${done}`;
      document.getElementById('pendingStat').textContent = `Pending: ${todos.length - done}`;

      if (!todos.length) {
        list.innerHTML = '<li class="empty">No tasks yet. Add one above!</li>';
        return;
      }
      list.innerHTML = todos.map(todo => `
        <li class="todo-item ${todo.completed ? 'completed' : ''}" id="item-${todo.id}">
          <input type="checkbox" ${todo.completed ? 'checked' : ''}
            onchange="toggleTodo(${todo.id}, this.checked)"/>
          <span class="task-text" id="text-${todo.id}">${escapeHtml(todo.task)}</span>
          <input class="edit-input" id="edit-${todo.id}" value="${escapeHtml(todo.task)}"
            style="display:none" onkeydown="if(event.key==='Enter') saveEdit(${todo.id})"/>
          <div class="actions">
            <button class="btn-edit" id="editBtn-${todo.id}" onclick="startEdit(${todo.id})">Edit</button>
            <button class="btn-save" id="saveBtn-${todo.id}" onclick="saveEdit(${todo.id})"
              style="display:none">Save</button>
            <button class="btn-delete" onclick="deleteTodo(${todo.id})">Delete</button>
          </div>
        </li>
      `).join('');
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(text));
      return d.innerHTML;
    }

    async function addTodo() {
      const input = document.getElementById('taskInput');
      const error = document.getElementById('error');
      const task = input.value.trim();
      if (!task) { error.style.display = 'block'; return; }
      error.style.display = 'none';
      await fetch(`${API}/todos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task })
      });
      input.value = '';
      loadTodos();
    }

    async function toggleTodo(id, completed) {
      await fetch(`${API}/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed: completed ? 1 : 0 })
      });
      loadTodos();
    }

    function startEdit(id) {
      document.getElementById(`text-${id}`).style.display = 'none';
      document.getElementById(`edit-${id}`).style.display = 'block';
      document.getElementById(`editBtn-${id}`).style.display = 'none';
      document.getElementById(`saveBtn-${id}`).style.display = 'block';
      document.getElementById(`edit-${id}`).focus();
    }

    async function saveEdit(id) {
      const newTask = document.getElementById(`edit-${id}`).value.trim();
      if (!newTask) return;
      await fetch(`${API}/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task: newTask })
      });
      loadTodos();
    }

    async function deleteTodo(id) {
      await fetch(`${API}/todos/${id}`, { method: 'DELETE' });
      loadTodos();
    }

    loadTodos();
  </script>
</body>
</html>
